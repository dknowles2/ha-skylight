# Notes are grouped by the conventional-commit prefix each PR title already
# carries, so nothing has to be labelled by hand.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: Breaking changes
    labels: [breaking]
  - title: Added
    labels: [feature]
  - title: Fixed
    labels: [fix]
  - title: Documentation
    labels: [docs]
  - title: Under the hood
    labels: [chore, ci, test, refactor]

autolabeler:
  # A `!` prefix marks a breaking change, the same convention the commits use.
  - label: breaking
    title: ['/^\w+(\(.+\))?!:/']
  - label: feature
    title: ["/^feat(\\(.+\\))?!?:/"]
  - label: fix
    title: ["/^fix(\\(.+\\))?!?:/"]
  - label: docs
    title: ["/^docs(\\(.+\\))?:/"]
  - label: ci
    title: ["/^ci(\\(.+\\))?:/"]
  - label: test
    title: ["/^test(\\(.+\\))?:/"]
  - label: refactor
    title: ["/^refactor(\\(.+\\))?:/"]
  - label: chore
    title: ["/^chore(\\(.+\\))?:/"]

# Versions are dates, not semver, and Release Drafter can only count. `patch`
# bumps the last component, which is right within a month — 2026.8.4 to
# 2026.8.5 — and wrong the moment the month turns, where it says 2026.8.6
# instead of 2026.9.0.
#
# So the drafted name is a suggestion, not an answer: run
# `scripts/next_version.py` and set the tag when publishing. `minor` was the
# default here for one commit and drafted 2026.9.0 in August, which is the
# failure worth avoiding — it looks plausible enough to publish by reflex.
version-resolver:
  default: patch

exclude-labels: [skip-changelog]

template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
