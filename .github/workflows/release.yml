name: Release

# Releasing is two steps, because `main` is protected and the version has to be
# committed: `manifest.json` is what Home Assistant and HACS read out of the
# source tree, so it cannot be derived at install time the way pyskylight's is.
#
#   1. Run this workflow. It works out the next calendar version, writes it into
#      the two files that carry it, and opens a PR.
#   2. Merge that PR once CI is green. The `tag` job below notices the new
#      version on `main`, tags it, and publishes the release.
#
# Nothing here needs a version typed by hand, and the release commit goes
# through CI like any other change.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; blank picks the next YYYY.M.N
        required: false
        type: string
  push:
    branches: [main]
    paths: ["custom_components/skylight/manifest.json"]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The next point release is derived from the existing tags, which a
          # shallow clone does not have.
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version=$(python3 scripts/next_version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a tag
        # Moving a published tag would leave HACS serving whichever it cached.
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      - name: Write the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/set_version.py "$VERSION"
          python3 scripts/check_version.py --tag "$TAG"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$VERSION"
          git add custom_components/skylight/manifest.json pyproject.toml
          git commit -m "chore: release $VERSION"
          git push origin "release/$VERSION"
          gh pr create --title "chore: release $VERSION" --base main \
            --body "Cuts \`$VERSION\`. Merging this tags it and publishes the release."

  tag:
    # Fires when a release PR lands. Any other change to the manifest is a
    # no-op, because the tag for that version already exists.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c \
            "import json;print(json.load(open('custom_components/skylight/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/check_version.py --tag "$TAG"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
