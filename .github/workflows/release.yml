name: Release

# Cutting a release is publishing the draft that Release Drafter has been
# building as pull requests merged. Publishing creates the tag, which fires this
# workflow: it stamps the version into `manifest.json`, zips the integration,
# signs it, and attaches the zip to the release.
#
# The version is never committed. `hacs.json` sets `zip_release`, so HACS
# installs the attached zip rather than the source tree, and the placeholder
# `0000.0.0` in the repository is replaced at release time. That is what keeps
# releasing off `main` entirely — no release commit, so no pull request, and
# nothing to reconcile with branch protection.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the release
      id-token: write # sigstore signs with an OIDC identity, not a stored key
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag is a calendar version
        # A tag of the wrong shape would be stamped into the manifest verbatim
        # and shipped, so it is rejected before anything is built.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG is not a vYYYY.M.N tag"
            exit 1
          fi

      - name: Stamp the version into the manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/stamp_version.py "${TAG#v}"

      - name: Zip the integration
        # Zipped from inside the component directory, because HACS unpacks the
        # archive straight into `custom_components/skylight/` — the paths inside
        # have to be relative to it.
        run: |
          cd custom_components/skylight
          zip -r skylight.zip . -x '__pycache__/*' '*/__pycache__/*'

      - name: Sign the zip
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: custom_components/skylight/skylight.zip
          release-signing-artifacts: true

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" custom_components/skylight/skylight.zip --clobber
