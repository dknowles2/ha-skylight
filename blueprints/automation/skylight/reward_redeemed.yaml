blueprint:
  name: Skylight — reward redeemed
  description: >-
    Notify when someone redeems a Skylight reward.


    This watches the frame's event entity rather than any dashboard, so it fires
    for a redemption made on the frame itself, in the Skylight app, or from Home
    Assistant. That is what makes it the one to rely on: Skylight has no notion
    of *requesting* a reward, only of redeeming one, so being told afterwards is
    the only account of a redemption that is complete.
  domain: automation
  homeassistant:
    min_version: "2026.8.0"
  source_url: https://github.com/dknowles2/ha-skylight/blob/main/blueprints/automation/skylight/reward_redeemed.yaml
  input:
    redeemed_event:
      name: Reward redeemed event
      description: The frame's "reward redeemed" event entity.
      selector:
        entity:
          filter:
            - integration: skylight
              domain: event
    profile:
      name: Only this profile
      description: >-
        Leave empty to be told about everyone. Otherwise the profile's name
        exactly as the frame spells it — the same name that appears on the chore
        chart.
      default: ""
      selector:
        text: {}
    notify_device:
      name: Device to notify
      description: >-
        A device running the Home Assistant app. This is all most people need —
        pick a phone and you get a notification saying what happened.


        Leave it empty if you would rather build the actions yourself below.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app
    notification:
      name: Or do something else
      description: >-
        Leave this empty unless you want something other than a phone
        notification — a speaker announcement, a light, a message somewhere
        else. Whatever you put here runs in addition to the notification above,
        or on its own if you chose no device.


        These are available to your actions: `reward`, `profile`, and `points` — what the reward cost.
      default: []
      selector:
        action: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input redeemed_event

variables:
  notify_device: !input notify_device
  # Guarded, because the device is optional here and `device_attr` on an empty
  # id has nothing to slugify. Written as one expression rather than an
  # `{% if %}` block purely because it is shorter; both render the same clean
  # value, which was checked rather than assumed.
  notify_action: >-
    {{ ('notify.mobile_app_' ~ (device_attr(notify_device, 'name') | slugify))
       if notify_device not in ['', none] else '' }}
  chosen_profile: !input profile
  reward: "{{ trigger.to_state.attributes.reward }}"
  profile: "{{ trigger.to_state.attributes.profile }}"
  points: "{{ trigger.to_state.attributes.point_value | int(0) }}"

conditions:
  # An event entity's state is the timestamp of its last event and its
  # attributes are that event's payload, so a state change is not the same thing
  # as something having happened. Three ways it lies, and all three have to be
  # refused or the automation announces the last event over again:
  #
  #   * a restart, where there is no previous state at all;
  #   * a failed poll, which makes the entity unavailable and whose recovery
  #     restores the very same timestamp — this is what announced a "Take pills"
  #     that was still sitting unticked on the list;
  #   * a write that changes only attributes, which a bare state trigger fires
  #     on just the same.
  #
  # `unknown` is deliberately allowed as a previous state: after a restart the
  # entity has no event yet, and the first genuine one has to get through.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state != trigger.from_state.state }}
  - condition: template
    value_template: "{{ chosen_profile == '' or chosen_profile == profile }}"

actions:
  - alias: Tell the phone, if one was chosen
    choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_device not in ['', none] }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: "{{ profile }} redeemed a reward"
              message: >-
                {{ reward }}{% if points %} — {{ points }} points{% endif %}

  # Empty unless somebody asked for something, in which case it runs whether or
  # not a phone was notified.
  - alias: Anything else you asked for
    sequence: !input notification
