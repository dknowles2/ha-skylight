blueprint:
  name: Skylight — reward within reach
  description: >-
    Notify when someone earns enough points to redeem a Skylight reward.


    Fires the moment a reward's `affordable` attribute turns true, so each
    reward announces itself once as it comes into reach rather than on every
    poll. A reward that becomes affordable again after being redeemed announces
    itself again, which is usually what you want on a chore chart.


    Nothing fires when Home Assistant restarts. A restart re-creates every
    entity, and without a guard every reward already in reach would announce
    itself as though it had just been earned.
  domain: automation
  homeassistant:
    min_version: "2026.8.0"
  source_url: https://github.com/dknowles2/ha-skylight/blob/main/blueprints/automation/skylight/reward_within_reach.yaml
  input:
    rewards:
      name: Rewards
      description: >-
        Which rewards to watch. Each one is a number entity whose value is its
        point cost. Picking every reward a child has is fine, but expect one
        notification per reward as their balance climbs past each price — for a
        quieter automation, choose only the ones worth interrupting you for.
      selector:
        entity:
          filter:
            - integration: skylight
              domain: number
          multiple: true
    notify_device:
      name: Device to notify
      description: >-
        A device running the Home Assistant app. This is all most people need —
        pick a phone and you get a notification saying what happened.


        Leave it empty if you would rather build the actions yourself below.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app
    notification:
      name: Or do something else
      description: >-
        Leave this empty unless you want something other than a phone
        notification — a speaker announcement, a light, a message somewhere
        else. Whatever you put here runs in addition to the notification above,
        or on its own if you chose no device.


        These are available to your actions: `reward`, `profile`, `cost`, `balance`, and `points_spare` — the points left over once the reward is paid for.
      default: []
      selector:
        action: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input rewards
    attribute: affordable
    to: true

conditions:
  # A restart has no previous state, and every affordable reward would otherwise
  # report itself as newly earned.
  #
  # An unavailable entity has no attributes at all, so a run of failed polls
  # followed by a recovery reads as `affordable` turning true again — the same
  # reward announced twice for one earning. Refused for the same reason the
  # restart is.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable' }}

variables:
  notify_device: !input notify_device
  # Guarded, because the device is optional here and `device_attr` on an empty
  # id has nothing to slugify. Written as one expression rather than an
  # `{% if %}` block purely because it is shorter; both render the same clean
  # value, which was checked rather than assumed.
  notify_action: >-
    {{ ('notify.mobile_app_' ~ (device_attr(notify_device, 'name') | slugify))
       if notify_device not in ['', none] else '' }}
  reward: "{{ trigger.to_state.attributes.reward }}"
  profile: "{{ trigger.to_state.attributes.profile }}"
  cost: "{{ trigger.to_state.state | int(0) }}"
  balance: "{{ trigger.to_state.attributes.balance | int(0) }}"
  points_spare: "{{ (trigger.to_state.attributes.balance | int(0)) - (trigger.to_state.state | int(0)) }}"

actions:
  - alias: Tell the phone, if one was chosen
    choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_device not in ['', none] }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: "{{ profile }} can afford a reward"
              message: >-
                {{ reward }} — {{ cost }} points, and they have {{ balance }}

  # Empty unless somebody asked for something, in which case it runs whether or
  # not a phone was notified.
  - alias: Anything else you asked for
    sequence: !input notification
